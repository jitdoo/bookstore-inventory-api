info:
  title: Bookstore Inventory API
  description: REST API for bookstore chain inventory and replenishment
  version: "1.0"
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    LoginDto:
      type: object
      properties:
        email:
          type: string
          example: user@example.com
        password:
          type: string
          example: password123
      required:
        - email
        - password
    RefreshDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
        newPassword:
          type: string
          example: Password123
      required:
        - currentPassword
        - newPassword
    CreateUserDto:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          example: user@example.com
        branchId:
          type: string
        role:
          type: string
          enum:
            - SUPER_ADMIN
            - BRANCH_MANAGER
            - BRANCH_STAFF
      required:
        - name
        - email
        - branchId
        - role
    UpdateMyProfileDto:
      type: object
      properties:
        name:
          type: string
      required:
        - name
    UpdateUserDto:
      type: object
      properties:
        name:
          type: string
    CreatePublisherDto:
      type: object
      properties:
        name:
          type: string
        businessNumber:
          type: string
          example: "1234567890"
        phone:
          type: string
          example: "01012345678"
        email:
          type: string
          example: example@example.com
        zipcode:
          type: string
          example: "06234"
        address:
          type: string
        addressDetail:
          type: string
        contractStartDate:
          type: string
          example: 2026-01-01
        contractEndDate:
          type: string
          example: 2027-01-01
      required:
        - name
        - businessNumber
    UpdatePublisherDto:
      type: object
      properties:
        name:
          type: string
        businessNumber:
          type: string
          example: "1234567890"
        phone:
          type: string
          example: "01012345678"
        email:
          type: string
          example: example@example.com
        zipcode:
          type: string
          example: "06234"
        address:
          type: string
        addressDetail:
          type: string
        contractStartDate:
          type: string
          example: 2026-01-01
        contractEndDate:
          type: string
          example: 2027-01-01
    CreateAuthorDto:
      type: object
      properties:
        name:
          type: string
        birthDate:
          type: string
          example: 1990-01-01
        countryCode:
          type: string
          example: KOR
      required:
        - name
    UpdateAuthorDto:
      type: object
      properties:
        name:
          type: string
        birthDate:
          type: string
          example: 1990-01-01
        countryCode:
          type: string
          example: KOR
    CreateBookDto:
      type: object
      properties:
        publisherId:
          type: string
        title:
          type: string
        isbn:
          type: string
          example: "9788936434120"
        price:
          type: string
          example: "15000.00"
        publishedDate:
          type: string
          example: 2024-03-15
        authorIds:
          example: &a15
            - "1"
            - "2"
          type: array
          items:
            type: string
      required:
        - publisherId
        - title
        - isbn
        - price
        - authorIds
    UpdateBookDto:
      type: object
      properties:
        publisherId:
          type: string
        title:
          type: string
        isbn:
          type: string
          example: "9788936434120"
        price:
          type: string
          example: "15000.00"
        publishedDate:
          type: string
          example: 2024-03-15
        authorIds:
          example: *a15
          type: array
          items:
            type: string
    CreateBranchDto:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          example: BERLIN001
        phone:
          type: string
          example: "01012345678"
        zipcode:
          type: string
          example: "06234"
        address:
          type: string
        addressDetail:
          type: string
        open_date:
          type: string
          example: 2026-01-01
      required:
        - name
        - code
    UpdateBranchDto:
      type: object
      properties:
        name:
          type: string
        code:
          type: string
          example: BERLIN001
        phone:
          type: string
          example: "01012345678"
        zipcode:
          type: string
          example: "06234"
        address:
          type: string
        addressDetail:
          type: string
        open_date:
          type: string
          example: 2026-01-01
